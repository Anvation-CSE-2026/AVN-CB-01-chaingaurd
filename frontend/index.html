      <div style="padding:24px;font-family:system-ui,sans-serif;color:#e6edf3;background:#0a0e12">
        <h1>ChainGuard needs JavaScript</h1>
        <p>This console renders real scan data in the browser. Without JavaScript you can still use the API
          directly: <code>GET /health</code>, <code>POST /scan</code>, <code>POST /scan/fleet</code> and
          <code>GET /scans/&lt;scan id&gt;/repositories/&lt;repo id&gt;/artifacts/&lt;name&gt;</code>, or the
          command line interface <code>python -m chainguard_mvp.cli &lt;path&gt; --out-dir &lt;dir&gt;</code>.</p>
      </div>
    </noscript>
