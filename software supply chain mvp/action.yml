name: ChainGuard MVP scan
description: Generate an SBOM, OpenVEX, and reachability-aware dependency report
inputs:
  path:
    description: Project directory to scan
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install ChainGuard MVP
      shell: bash
      run: python -m pip install '${{ github.action_path }}'
    - name: Scan dependencies
      shell: bash
      run: chainguard-mvp '${{ inputs.path }}' --out-dir ./out --fail-on-actionable
    - name: Upload scan artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chainguard-mvp-report
        path: out/
        if-no-files-found: warn
